# docker-compose.yml — Uso local / Windows / Unraid (HTTP, rede interna)
# Arranque: docker compose up --build -d
# Acesso:   http://IP-DO-SERVIDOR:85

version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - helpdesk_data:/app/data
    ports:
      - "8089:8089"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "85:80"
    depends_on:
      - backend

volumes:
  helpdesk_data:
    driver: local
