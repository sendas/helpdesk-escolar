<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Nova Sugestão</title></head>
<body style="font-family: Arial, sans-serif; color: #333; max-width: 600px; margin: 0 auto;">
  <div style="background: #3D52D5; color: white; padding: 20px; border-radius: 4px 4px 0 0;">
    <h2 style="margin:0">💡 Nova sugestão recebida</h2>
  </div>
  <div style="padding: 20px; border: 1px solid #ddd; border-top: none; border-radius: 0 0 4px 4px;">
    <table style="width:100%; border-collapse: collapse; margin-bottom:16px">
      <tr><td style="padding:8px; font-weight:bold; width:30%">Enviado por</td><td style="padding:8px">{{ author_name }}</td></tr>
      <tr style="background:#f5f5f5"><td style="padding:8px; font-weight:bold">Data</td><td style="padding:8px">{{ created_at }}</td></tr>
    </table>
    <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:14px">
      <div style="font-weight:bold;margin-bottom:8px;color:#1f2937">Sugestão</div>
      <div style="white-space:pre-wrap;line-height:1.55;color:#334155">{{ text }}</div>
    </div>
    {% if suggestions_url %}
    <p style="margin:24px 0 10px">
      <a href="{{ suggestions_url }}" style="background:#3D52D5;color:#fff;text-decoration:none;padding:12px 18px;border-radius:6px;display:inline-block;font-weight:bold">Ver todas as sugestões</a>
    </p>
    {% endif %}
    <p style="color:#666; font-size:0.9em; margin-top:20px">Helpdesk Escolar — Centro de Apoio Digital do Agrupamento</p>
  </div>
</body>
</html>
