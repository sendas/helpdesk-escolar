<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Foi mencionado num ticket</title></head>
<body style="font-family: Arial, sans-serif; color: #333; max-width: 600px; margin: 0 auto;">
  <div style="background: #3D52D5; color: white; padding: 20px; border-radius: 4px 4px 0 0;">
    <h2 style="margin:0">@ {{ author }} mencionou-o</h2>
  </div>
  <div style="padding: 20px; border: 1px solid #ddd; border-top: none; border-radius: 0 0 4px 4px;">
    <p><strong>{{ author }}</strong> mencionou-o numa {{ kind }} do ticket <strong>#{{ id }} — {{ title }}</strong>.</p>
    <div style="background:#EEF2FF;border:1px solid #C7D2FE;border-radius:6px;padding:14px;white-space:pre-wrap;line-height:1.45">{{ comment }}</div>
    {% if ticket_url %}
    <p style="margin:24px 0 10px">
      <a href="{{ ticket_url }}" style="background:#3D52D5;color:#fff;text-decoration:none;padding:12px 18px;border-radius:6px;display:inline-block;font-weight:bold">Abrir ticket</a>
    </p>
    {% endif %}
    <p style="color:#666; font-size:0.9em; margin-top:20px">Sistema de Tickets — Escola</p>
  </div>
</body>
</html>
